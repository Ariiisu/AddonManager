name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AddonManager/AddonManager.csproj

      - name: Build Project
        run: dotnet build AddonManager/AddonManager.csproj --no-restore -c Release

      - name: Publish AddonManager
        run: dotnet publish AddonManager/AddonManager.csproj --no-build -c Release -o ./publish /p:PublishReadyToRun=false

      - name: Prepare Artifact
        run: |
          mkdir -p package/sharp/modules/AddonManager
          cp -r publish/* package/sharp/modules/AddonManager/
          # If the 'sharp' config folder exists in repo root, copy it as well
          if [ -d "sharp" ]; then
            cp -r sharp/* package/sharp/
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AddonManager-Artifact
          path: package/

      - name: Create Zip Archive for Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd package
          zip -r ../AddonManager.zip .
          cd ..

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AddonManager.zip
          generate_release_notes: true
